<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Chand Connect</title>
<meta name="description" content="A Karwa Chauth film for couples who are far apart. Fork it, edit config.js, send the link.">
<meta property="og:title" content="Chand Connect 🌙">
<meta property="og:description" content="Ek Karwa Chauth kahani, sirf tumhare liye.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rozha+One&family=Tiro+Devanagari+Hindi&family=Noto+Sans+Telugu:wght@500;700&family=Baloo+2:wght@600;800&display=swap">
<style>
/* Sanatani palette: sindoor, kumkum, haldi, genda, mehendi, zari */
:root{
  --kumkum:#5c0a14; --sindoor:#c1121f; --haldi:#f4b400; --genda:#ff8c1a;
  --mehendi:#6b8e23; --mehendiDark:#7a3b12; --zari:#e6b84a; --cream:#fff3dc; --dim:#f1cfb5;
  --display:"Rozha One",Georgia,serif; --hand:"Baloo 2",system-ui,sans-serif; --body:"Baloo 2",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:#2a0309;color:var(--cream);font-family:var(--body);overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
.app{position:relative;height:100%;aspect-ratio:9/16;max-width:100%;margin:0 auto;overflow:hidden;box-shadow:0 0 0 1px rgba(230,184,74,.3)}
#film{position:absolute;inset:0;width:100%;height:100%;display:block}
.bars{position:absolute;top:calc(10px + env(safe-area-inset-top,0px));left:12px;right:12px;display:flex;gap:4px;z-index:5}
.bars i{flex:1;height:3px;border-radius:2px;background:rgba(255,243,220,.25);overflow:hidden}
.bars i b{display:block;height:100%;width:0;background:var(--haldi)}
.chip{position:absolute;top:calc(22px + env(safe-area-inset-top,0px));left:12px;z-index:5;font:600 .85rem var(--hand);display:flex;gap:6px;align-items:center;color:var(--cream)}
.chip span{width:28px;height:28px;border-radius:50%;background:radial-gradient(circle,var(--haldi),var(--sindoor));display:grid;place-items:center;border:2px solid var(--zari)}
.mute{position:absolute;top:calc(20px + env(safe-area-inset-top,0px));right:12px;z-index:6;background:rgba(92,10,20,.8);border:1px solid var(--zari);color:var(--cream);border-radius:999px;padding:4px 10px;font:800 .8rem var(--body);cursor:pointer}
.cap{position:absolute;left:0;right:0;bottom:calc(22px + env(safe-area-inset-bottom,0px));z-index:5;padding:0 18px;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.line{font-family:var(--hand);font-weight:700;font-size:clamp(1.25rem,5.6vw,1.65rem);line-height:1.3;text-align:center;text-wrap:balance;color:var(--cream);text-shadow:0 2px 0 var(--kumkum),0 3px 14px rgba(0,0,0,.9);animation:rise .7s cubic-bezier(.2,1.3,.4,1) both;white-space:pre-line}
.line.big{font-family:var(--display);font-weight:400;font-size:clamp(1.9rem,9vw,2.6rem);color:var(--haldi)}
.line.punch{font-family:var(--display);font-weight:400;font-size:clamp(1.5rem,7vw,2rem);color:#fff;background:var(--sindoor);padding:2px 14px;border-radius:6px;transform:rotate(-2deg);text-shadow:none;box-shadow:4px 4px 0 var(--kumkum)}
@keyframes rise{from{opacity:0;transform:translateY(16px) scale(.96)}}
.choices{display:grid;gap:10px;width:100%;pointer-events:auto;animation:rise .5s both}
.choices button,.cta{font:800 1.02rem var(--body);border:2px solid var(--zari);border-radius:14px;padding:13px;cursor:pointer;color:var(--kumkum);background:linear-gradient(180deg,#ffd75e,var(--haldi));box-shadow:0 4px 0 var(--mehendiDark)}
.choices button:nth-child(2){background:linear-gradient(180deg,#e8323f,var(--sindoor));color:var(--cream)}
.choices button:active,.cta:active{transform:translateY(3px);box-shadow:none}
button:focus-visible,a:focus-visible{outline:3px solid var(--haldi);outline-offset:2px}
.polaroid{position:absolute;z-index:4;background:#fff8ec;padding:8px 8px 30px;border-radius:4px;box-shadow:0 10px 30px rgba(0,0,0,.6);width:min(46%,210px);animation:drop .8s cubic-bezier(.2,1.5,.4,1) both}
.polaroid img,.polaroid video{width:100%;aspect-ratio:1;object-fit:cover;display:block;border-radius:2px;background:#ddd}
.polaroid figcaption{position:absolute;left:0;right:0;bottom:6px;text-align:center;font:700 .85rem var(--hand);color:var(--kumkum)}
.polaroid::before{content:"";position:absolute;top:-10px;left:50%;width:60px;height:18px;margin-left:-30px;background:rgba(244,180,0,.7);transform:rotate(-3deg)}
@keyframes drop{from{opacity:0;transform:translateY(-80px) rotate(-25deg) scale(.6)}}
.coupon{pointer-events:auto;width:100%;background:linear-gradient(135deg,#fff3dc,#ffe0a6);color:var(--kumkum);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:6px;border:2px dashed var(--sindoor);animation:rise .6s both}
.coupon h3{margin:0;font-family:var(--display);font-weight:400;font-size:1.6rem;color:var(--sindoor)}
.coupon p{margin:0;font:700 1.05rem var(--hand);line-height:1.35}
.coupon small{color:var(--mehendiDark);font-weight:800;letter-spacing:.06em;text-transform:uppercase;font-size:.68rem}
.songs{pointer-events:auto;display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.songs a{font:800 .82rem var(--body);background:rgba(92,10,20,.85);color:var(--cream);border:1px solid var(--zari);border-radius:999px;padding:6px 12px;text-decoration:none}
.again{pointer-events:auto;background:none;border:0;color:var(--dim);font:700 .9rem var(--hand);text-decoration:underline;cursor:pointer}
.hint{position:absolute;left:0;right:0;bottom:22%;text-align:center;z-index:4;font:700 1.1rem var(--hand);color:var(--haldi);pointer-events:none;animation:pulse 1.6s infinite}
@keyframes pulse{50%{opacity:.35}}
.patra{position:absolute;z-index:6;left:12px;right:12px;top:calc(48px + env(safe-area-inset-top,0px));bottom:calc(12px + env(safe-area-inset-bottom,0px));overflow-y:auto;background:linear-gradient(#fff6e2,#ffe7b8);color:#4a0a10;border-radius:14px;padding:20px 18px;border:3px double var(--sindoor);box-shadow:0 0 0 6px rgba(230,184,74,.5),0 20px 60px rgba(0,0,0,.6);animation:rise .8s both;-webkit-user-select:text;user-select:text}
.patra .us{display:block;width:120px;height:120px;object-fit:cover;border-radius:50%;margin:0 auto 10px;border:4px solid var(--zari)}
.patra h2{font-family:var(--display);font-weight:400;font-size:1.6rem;color:var(--sindoor);text-align:center;margin:6px 0}
.patra p{margin:0 0 4px;line-height:1.5}
.patra .sk{font-family:var(--display);text-align:center;font-size:1.15rem;color:var(--mehendiDark)}
.patra .hi{font-family:"Tiro Devanagari Hindi","Noto Sans Telugu",var(--display);font-size:1.02rem;white-space:pre-line;line-height:1.55}
.patra .c{text-align:center}
.patra .vc{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px dashed rgba(193,18,31,.35)}
.patra .vc .ic{font-size:1.5rem;line-height:1.2}
.patra .closing{font-family:"Noto Sans Telugu","Tiro Devanagari Hindi",var(--display);text-align:center;font-size:1.25rem;color:var(--sindoor);margin:14px 0 2px;font-weight:700}
.patra .en{font-family:var(--body);font-size:.82rem;color:#8a3a2a;margin-bottom:2px}
.patra ol{padding-left:22px;margin:12px 0}.patra li{margin-bottom:10px}.patra li::marker{color:var(--sindoor);font-weight:800}
.patra .doha{font-family:"Tiro Devanagari Hindi",var(--display);text-align:center;font-size:1.25rem;line-height:1.6;white-space:pre-line;color:var(--sindoor);margin:4px 0 2px}
.patra .sign{text-align:right;font-family:var(--hand);font-size:1.2rem;font-weight:700}
.patra .claim{display:inline-block;margin-top:4px;font:800 .8rem var(--body);background:var(--sindoor);color:#fff;border-radius:999px;padding:4px 12px;text-decoration:none}
.patra .reply{display:block;text-align:center;margin:14px 0 6px;font:800 1.05rem var(--body);background:linear-gradient(180deg,#25d366,#128c7e);color:#fff;border-radius:14px;padding:13px;text-decoration:none;box-shadow:0 4px 0 #075e54}
.patra .songs a{background:var(--kumkum)}.patra .again{color:var(--kumkum);display:block;margin:12px auto 0}
.reelbtn{pointer-events:auto;font:800 1rem var(--body);background:linear-gradient(90deg,#f58529,#dd2a7b,#8134af);color:#fff;border:0;border-radius:14px;padding:12px 18px;cursor:pointer;box-shadow:0 4px 0 rgba(0,0,0,.35)}
.rec{position:absolute;z-index:8;left:50%;top:calc(46px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:#c1121f;color:#fff;font:800 .85rem var(--body);border-radius:999px;padding:4px 12px;animation:pulse 1.2s infinite}
.done{position:absolute;inset:0;z-index:9;display:grid;place-items:center;background:rgba(20,2,6,.88);padding:24px;text-align:center}
.done h2{font-family:var(--display);font-weight:400;color:var(--haldi);font-size:2rem;margin:0 0 8px}.done p{margin:0 0 14px;line-height:1.4}
#yt{position:absolute;width:1px;height:1px;left:-10px;top:-10px;opacity:0;pointer-events:none}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<div class="app" id="app">
  <canvas id="film" aria-label="Animated Karwa Chauth story"></canvas>
  <div class="bars" id="bars"></div>
  <div class="chip"><span>🪔</span><b id="epName"></b></div>
  <button class="mute" id="mute" aria-label="Mute">🔊</button>
  <div class="cap" id="cap"></div>
  <div id="yt"></div>
  <audio id="aud" loop preload="auto"></audio>
</div>
<script src="config.js"></script>
<script src="config.private.js" onerror="void 0"></script>
<script>
/* merge private overrides (config.private.js is never uploaded to GitHub) */
(function(){const P=window.PRIVATE;if(!P)return;const C=window.CONFIG;
 const merge=(t,s)=>{for(const k in s){if(s[k]&&typeof s[k]==="object"&&!Array.isArray(s[k])&&t[k]&&typeof t[k]==="object")merge(t[k],s[k]);else t[k]=s[k]}};merge(C,P)})();
</script>
<script>
/* easy-box song link → background song + first song button */
(function(){const C=window.CONFIG,m=(C.song||"").match(/(?:v=|youtu\.be\/|shorts\/)([\w-]{11})/);if(!m)return;
 for(const k of["moon","memory"])if(!C.music[k].youtube&&!C.music[k].file)C.music[k].youtube=m[1];if(C.songs&&C.songs[0]&&!C.songs[0].youtube)C.songs[0].youtube=m[1]})();
/* {HER} / {HIM} in any line → the names from the top of config.js */
(function(){const C=window.CONFIG,h=C.her.name,m=C.him.name;const sub=v=>typeof v==="string"?v.replace(/\{HER\}/g,h).replace(/\{HIM\}/g,m):Array.isArray(v)?v.map(sub):v&&typeof v==="object"?Object.fromEntries(Object.entries(v).map(([k,x])=>[k,k==="photos"?x:sub(x)])):v;
 for(const k of Object.keys(C))if(!["photos","voiceNote","music","media"].includes(k))C[k]=sub(C[k])})();
const C=window.CONFIG,HER=C.her.name,HIM=C.him.name,BOY=C.herCap!==false&&!(C.her.tagline&&!/boy/i.test(C.her.tagline));
/* ================= canvas & drawing kit ================= */
const film=document.getElementById("film");let c=film.getContext("2d"),W,H,U;
function sz(){if(REEL){W=film.width=720;H=film.height=1280}else{const r=film.getBoundingClientRect(),d=Math.min(2,devicePixelRatio);W=film.width=r.width*d;H=film.height=r.height*d}U=Math.min(W,H*.62)/100}sz();addEventListener("resize",sz);
const stars=Array.from({length:90},()=>[Math.random(),Math.random()*.6,Math.random()*6]);
let parts=[];
const ease=k=>k<0?0:k>1?1:1-Math.pow(1-k,3),lerp=(a,b,k)=>a+(b-a)*ease(k),clamp=(k)=>Math.max(0,Math.min(1,k));
function emo(e,x,y,vx,vy,s=8,life=1.8,g=-.02,spin=0){parts.push({e,x,y,vx,vy,s,l:life,m:life,g,r:0,spin})}
function petals(n=1){for(let i=0;i<n;i++)emo(["🌼","🌸","🏵️"][Math.floor(Math.random()*3)],Math.random()*W,-5*U,(Math.random()-.5)*.25*U,(.25+Math.random()*.25)*U,4+Math.random()*2,7,0,(Math.random()-.5)*.05)}
function sparks(x,y,n=50){const cols=["#f4b400","#ff8c1a","#c1121f","#fff3dc","#e6b84a"];for(let i=0;i<n;i++){const a=Math.random()*6.28,v=(Math.random()*1.6+.4)*U;parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,col:cols[i%5],l:1.2,m:1.2,g:.03})}}
function stepParts(){parts=parts.filter(p=>p.l>0);for(const p of parts){p.x+=p.vx;p.y+=p.vy;p.vy+=p.g*U;p.l-=1/60;p.r+=p.spin||0;c.globalAlpha=clamp(p.l/p.m*2);
 if(p.e){c.save();c.translate(p.x,p.y);c.rotate(p.r);c.font=p.s*U+"px serif";c.textAlign="center";c.textBaseline="middle";c.fillText(p.e,0,0);c.restore()}else{c.fillStyle=p.col;c.beginPath();c.arc(p.x,p.y,U*.5,0,7);c.fill()}}c.globalAlpha=1}
function ch(who,x,y,s,face,p={},t=0){const u=U*s;c.save();c.translate(x,y);c.scale(face,1);
 const step=p.walk?Math.sin(t/90)*4*u:0;
 if(!p.sit){c.strokeStyle=who==="sweety"?"#7a0a2a":"#2b2b3a";c.lineWidth=2.6*u;c.lineCap="round";c.beginPath();c.moveTo(-2*u,-12*u);c.lineTo(-2*u+step,0);c.moveTo(2*u,-12*u);c.lineTo(p.kick?12*u:2*u-step,p.kick?-10*u:0);c.stroke()}
 c.rotate(p.lean||0);
 c.fillStyle=who==="sweety"?"#e8123c":(p.office?"#4a78c8":"#ffc83d");c.beginPath();
 if(who==="sweety"){c.moveTo(-5*u,-30*u);c.lineTo(5*u,-30*u);c.lineTo(9*u,-11*u);c.lineTo(-9*u,-11*u)}else{c.moveTo(-6*u,-30*u);c.lineTo(6*u,-30*u);c.lineTo(7*u,-11*u);c.lineTo(-7*u,-11*u)}c.closePath();c.fill();
 if(who==="sweety"){c.strokeStyle="#ffc83d";c.lineWidth=1*u;c.beginPath();c.moveTo(-9*u,-12*u);c.lineTo(9*u,-12*u);c.stroke();c.strokeStyle="#ff8c1a";c.lineWidth=2*u;c.beginPath();c.moveTo(-4*u,-30*u);c.quadraticCurveTo(-10*u,-22*u+Math.sin(t/200)*u,-12*u,-14*u);c.stroke()}
 c.strokeStyle=who==="sweety"?"#e8123c":(p.office?"#4a78c8":"#ffc83d");c.lineWidth=2.4*u;const ar=p.arms||0;
 c.beginPath();c.moveTo(-4*u,-28*u);c.lineTo(-8*u-ar*2*u,-18*u-ar*8*u);c.moveTo(4*u,-28*u);c.lineTo(8*u+ar*6*u,-18*u-ar*6*u);c.stroke();
 c.fillStyle="#d79a6b";c.beginPath();c.arc(0,-36*u,6.5*u,0,7);c.fill();
 if(who==="sweety"){c.fillStyle="#1a0a0a";c.beginPath();c.arc(0,-38*u,6.8*u,Math.PI*.95,Math.PI*2.05);c.fill();c.fillRect(-7*u,-38*u,2.5*u,12*u);
  if(!p.nocap){c.fillStyle="#3ddc84";c.beginPath();c.arc(0,-40*u,6.6*u,Math.PI,0);c.fill();c.fillRect(-11*u,-41.5*u,6*u,2*u)}
  c.fillStyle="#e8123c";c.beginPath();c.arc(1.5*u,-38.5*u,.8*u,0,7);c.fill()}
 else{c.fillStyle="#1a0a0a";c.beginPath();c.arc(0,-38*u,6.8*u,Math.PI*1.05,Math.PI*1.95);c.fill();c.strokeStyle="#1a0a0a";c.lineWidth=1.2*u;c.beginPath();c.moveTo(1*u,-33.5*u);c.quadraticCurveTo(4*u,-35*u,6*u,-33*u);c.stroke()}
 c.fillStyle="#1a0a0a";if(p.eyes==="closed"){c.lineWidth=.8*u;c.strokeStyle="#1a0a0a";c.beginPath();c.arc(3*u,-37*u,1.2*u,0,Math.PI);c.stroke()}else if(p.eyes==="up"){c.beginPath();c.arc(3.3*u,-38*u,1*u,0,7);c.fill()}else{c.beginPath();c.arc(3*u,-37*u,1*u,0,7);c.fill()}
 c.strokeStyle="#7a1a1a";c.lineWidth=.9*u;c.beginPath();if(p.chew){const o=Math.abs(Math.sin(t/80))*1.2*u;c.ellipse(4*u,-33*u,1.4*u,.3*u+o,0,0,7);c.fillStyle="#7a1a1a";c.fill()}else if(p.sad){c.arc(4*u,-31.5*u,1.6*u,Math.PI*1.15,Math.PI*1.85);c.stroke()}else if(p.shock){c.arc(4*u,-33*u,1.4*u,0,7);c.fillStyle="#7a1a1a";c.fill()}else{c.arc(4*u,-34*u,1.8*u,Math.PI*.1,Math.PI*.9);c.stroke()}
 if(p.blush){c.fillStyle="rgba(255,46,147,.55)";c.beginPath();c.arc(1*u,-34*u,1.8*u,0,7);c.fill()}
 if(p.tear){c.fillStyle="#8be9ff";c.beginPath();c.arc(3.5*u,-34*u+((t/8)%(6*u)),.7*u,0,7);c.fill()}
 c.restore()}
function sky(t,a=1,top="#1a0410",bot="#5c0a14"){const g=c.createLinearGradient(0,0,0,H);g.addColorStop(0,top);g.addColorStop(1,bot);c.fillStyle=g;c.fillRect(0,0,W,H);
 for(const s of stars){c.globalAlpha=a*(.25+.75*Math.abs(Math.sin(t/700+s[2])));c.fillStyle="#fff3dc";c.fillRect(s[0]*W,s[1]*H,U*.45,U*.45)}c.globalAlpha=1}
function moon(x,y,r,glow=.55){const g=c.createRadialGradient(x,y,0,x,y,r*3.4);g.addColorStop(0,`rgba(255,230,160,${glow})`);g.addColorStop(1,"rgba(255,230,160,0)");c.fillStyle=g;c.fillRect(0,0,W,H);c.fillStyle="#ffe7a6";c.beginPath();c.arc(x,y,r,0,7);c.fill();c.fillStyle="rgba(200,170,100,.25)";[[-.3,-.2,.18],[.25,.15,.22],[-.05,.35,.1]].forEach(([a,b,s])=>{c.beginPath();c.arc(x+a*r,y+b*r,s*r,0,7);c.fill()})}
function txt(s,x,y,size,col="#fff3dc",font='"Baloo 2",sans-serif',w=800){c.font=`${w} ${size*U}px ${font}`;c.textAlign="center";c.textBaseline="middle";c.fillStyle=col;c.fillText(s,x,y)}
/* toran: marigold strings + mango leaves */
function toran(t){c.strokeStyle="#7a3b12";c.lineWidth=.5*U;c.beginPath();c.moveTo(0,2*U);c.lineTo(W,2*U);c.stroke();
 const n=Math.ceil(W/(6*U));for(let i=0;i<=n;i++){const x=i*6*U,sw=Math.sin(t/600+i)*.08;c.save();c.translate(x,2*U);c.rotate(sw);
  if(i%3===1){c.fillStyle="#4f7a1a";c.beginPath();c.ellipse(0,6*U,1.6*U,5*U,0,0,7);c.fill();c.strokeStyle="#2f4a0a";c.lineWidth=.25*U;c.beginPath();c.moveTo(0,1.5*U);c.lineTo(0,10*U);c.stroke()}
  else for(let j=0;j<3;j++){c.fillStyle=j%2?"#f4b400":"#ff8c1a";c.beginPath();c.arc(0,(3+j*3)*U,1.7*U,0,7);c.fill()}c.restore()}}
/* mehendi corner: paisley + dots + vines, drawn procedurally */
function mehendi(x,y,s,rot,a=.55){c.save();c.translate(x,y);c.rotate(rot);c.scale(s,s);c.globalAlpha=a;c.strokeStyle="#c26a2a";c.fillStyle="#c26a2a";c.lineWidth=.35*U;
 c.beginPath();c.moveTo(0,0);c.bezierCurveTo(14*U,-2*U,18*U,12*U,8*U,16*U);c.bezierCurveTo(0,19*U,-4*U,10*U,4*U,8*U);c.bezierCurveTo(8*U,7*U,9*U,12*U,6*U,12*U);c.stroke();
 for(let i=0;i<9;i++){const a2=i/8*Math.PI*.9;c.beginPath();c.arc(Math.cos(a2)*22*U,Math.sin(a2)*22*U,.6*U,0,7);c.fill()}
 for(let i=0;i<6;i++){c.save();c.rotate(i/6*Math.PI/2);c.beginPath();c.ellipse(28*U,0,3*U,1.1*U,0,0,7);c.stroke();c.restore()}
 c.beginPath();c.arc(0,0,3*U,0,7);c.stroke();c.beginPath();c.arc(0,0,1.2*U,0,7);c.fill();c.restore();c.globalAlpha=1}
function frame(){mehendi(0,H,1,-Math.PI/2,.5);mehendi(W,H,1,Math.PI,.5)}
